<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Sistema de Préstamos</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830284.png">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="login-card">
        <h1>Control de Préstamos</h1>
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Cédula de Administrador" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
